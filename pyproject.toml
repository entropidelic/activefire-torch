[project]
name = "activefire-torch"
version = "0.1.0"
description = "PyTorch reimplementation of active fire detection in Landsat-8 images (Pereira et al., 2021)"
readme = "README.md"
authors = [
    { name = "Mariano Nicolini", email = "mariano.nicolini@lambdaclass.com" }
]
requires-python = ">=3.13"
dependencies = [
    "h5py>=3.16.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.2",
    "scikit-learn>=1.9.1",
    "tensorboard>=2.21.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "wandb>=0.30.0",
]

[project.scripts]
train = "activefire_torch.train:main"  # uv run train <config> | uv run train --resume <run folder>

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
]

# Tell the type checker (Pyright, used by most editors) to use the project's
# environment, so it sees the installed packages and their type hints.
[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["tests"]  # lets tests import tests/helpers.py
